version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: social_engine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-engine_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engine_pass}
      POSTGRES_DB: ${POSTGRES_DB:-social_engine}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-engine_user} -d ${POSTGRES_DB:-social_engine}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: social_engine_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: social_engine_litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  jobspy-service:
    build:
      context: ../apps/jobspy-service
      dockerfile: Dockerfile
    container_name: social_engine_jobspy
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: social_engine_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-engine_user}:${POSTGRES_PASSWORD:-engine_pass}@postgres:5432/${POSTGRES_DB:-social_engine}?schema=public
      REDIS_URL: redis://redis:6379/0
      LITELLM_BASE_URL: http://litellm:4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_storage:/app/storage/media

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: social_engine_worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-engine_user}:${POSTGRES_PASSWORD:-engine_pass}@postgres:5432/${POSTGRES_DB:-social_engine}?schema=public
      REDIS_URL: redis://redis:6379/0
      LITELLM_BASE_URL: http://litellm:4000
      JOBSPY_SERVICE_URL: http://jobspy-service:8000
      MEDIA_OUTPUT_DIR: /app/storage/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jobspy-service:
        condition: service_started
      litellm:
        condition: service_started
    volumes:
      - media_storage:/app/storage/media

  caddy:
    image: caddy:2-alpine
    container_name: social_engine_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - media_storage:/app/storage/media
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  media_storage:
